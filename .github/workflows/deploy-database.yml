# Pushes database migrations and Edge Functions to a Supabase project (DEPLOYMENT_GUIDE.md §3–4).
# Manual only. Each target is a GitHub environment (staging / production) holding:
#   secrets  SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
#   vars     SUPABASE_PROJECT_REF
# Protect the `production` environment with required reviewers so a push needs a second person.
name: Deploy database

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy to
        type: choice
        options: [staging, production]
        required: true
      functions:
        description: Also deploy Edge Functions
        type: boolean
        default: true

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check configuration
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "$PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error title=Deploy not configured::Set in the ${{ inputs.target }} environment:$missing"
            exit 1
          fi
      - name: Link project
        run: npx supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Migrations to apply (dry run)
        run: npx supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: npx supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy Edge Functions
        if: inputs.functions
        run: |
          for f in supabase/functions/*/; do
            name=$(basename "$f")
            echo "Deploying $name"
            npx supabase functions deploy "$name" --project-ref "$PROJECT_REF"
          done
