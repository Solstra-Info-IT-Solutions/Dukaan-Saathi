name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (includes architecture boundary rules)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Generated SQL tests (money fixtures, contract checks) are up to date
        run: npm run db:fixtures && git diff --exit-code supabase/tests/database/
      - name: Database pre-check (PGlite)
        run: npm run db:check:local
      - name: Admin production build
        run: npm run build --workspace @ds/admin
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Mobile bundle (Metro export)
        run: npx expo export --platform android --output-dir /tmp/expo-export
        working-directory: apps/mobile
        env:
          CI: 1

  database:
    name: Supabase migrations + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start Supabase (database, auth, storage)
        run: npx supabase start --exclude studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: pgTAP
        # Failing lines are also emitted as annotations, which are readable without log access.
        run: |
          set -o pipefail
          npx supabase test db 2>&1 | tee /tmp/pgtap.log || {
            grep -E "not ok|Failed|# +(Failed|got|expected|Looks)|ERROR|Result: FAIL" /tmp/pgtap.log | head -30               | while IFS= read -r line; do echo "::error title=pgTAP::$line"; done
            exit 1
          }
      - name: Concurrency checks (create_sale)
        run: bash supabase/tests/concurrency/invoice-sequence.sh
      - name: Generated DB types are current
        # Not blocking until the first generated file is committed in Phase 02.
        continue-on-error: true
        run: npx supabase gen types typescript --local > /tmp/database.types.ts && diff -u packages/contracts/src/database.types.ts /tmp/database.types.ts
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
